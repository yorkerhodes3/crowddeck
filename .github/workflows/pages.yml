name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/**"
      - "SPECIFICATION.md"
      - ".github/workflows/pages.yml"
      # The playable demo is assembled from these at build time, so a change to
      # the deck or the engine must redeploy the page. Without them the published
      # demo silently drifts behind the code it is supposed to demonstrate.
      - "clients/deck/**"
      - "engine-web/**"
      - "providers/src/cc-licence.js"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Regenerates requirements from SPECIFICATION.md, validates backlog
      # traceability (fails if a story cites a requirement that doesn't exist),
      # then bundles the JSON the dashboard loads. Doubles as a data linter.
      - name: Extract requirements from SPECIFICATION.md
        run: node tools/extract-requirements.mjs

      - name: Build backlog and validate traceability
        run: node tools/build-backlog.mjs

      - name: Build data bundle
        run: node tools/build-data.mjs

      # Assembles the playable deck into docs/. Fails the build if any module the
      # demo imports is missing, so a broken demo cannot be published — the link
      # would still resolve and the page would still render, and the first symptom
      # would be a blank deck for whoever opened it.
      - name: Build playable demo
        run: node tools/build-demo.mjs

      - name: Verify generated files are current
        run: |
          if ! git diff --quiet -- docs/data/ BACKLOG.md; then
            echo "::warning::Generated files were stale and have been regenerated for this deploy."
            echo "Run the tools/ scripts locally and commit the result."
            git diff --stat -- docs/data/ BACKLOG.md
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
